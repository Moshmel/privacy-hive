    <style>
        body {
            background-color: var(--color-primary-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            margin: 0;
            font-family: var(--font-base);
        }
        .thank-you-card {
            background: #FFFFFF;
            border-radius: var(--radius-lg);
            padding: 3.5rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 580px;
            width: 100%;
            position: relative;
        }
        .thank-you-logo {
            margin-bottom: 2rem;
        }
        .thank-you-logo img {
            height: 48px;
            width: auto;
        }
        .success-icon {
            font-size: 4.5rem;
            color: var(--color-accent);
            margin-bottom: 1.2rem;
            animation: scaleIn 0.5s ease-out;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .thank-you-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--color-primary);
            margin-bottom: 0.8rem;
            line-height: 1.2;
        }
        .thank-you-text {
            font-size: 1.15rem;
            color: #475569;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .founders-wrapper {
            margin-top: 1.5rem;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        .founders-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
        @media (max-width: 768px) {
            .thank-you-card {
                padding: 2.5rem 1.25rem;
            }
            .thank-you-title {
                font-size: 1.8rem;
            }
            .thank-you-text {
                font-size: 1rem;
            }
        }
    </style>
